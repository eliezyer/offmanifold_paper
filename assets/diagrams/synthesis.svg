<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-label="Synthesis of on-manifold integration and off-manifold segregation">
  <rect width="1120" height="470" fill="#050505"/>
  <g transform="translate(70 64)">
    <path d="M80 224 C236 76, 410 104, 550 210 C684 310, 832 296, 970 160" fill="none" stroke="#d13ab7" stroke-width="10" stroke-linecap="round"/>
    <path d="M640 254 C730 205, 809 184, 906 174" fill="none" stroke="#23aee7" stroke-width="10" stroke-linecap="round"/>
    <path d="M638 254 L752 308" fill="none" stroke="#23aee7" stroke-width="10" stroke-linecap="round"/>
    <path d="M70 254 H1000" stroke="#f2f2ef" stroke-opacity=".16"/>
    <g fill="#f2f2ef" font-family="Inter, Arial, sans-serif">
      <text x="70" y="36" font-size="18" font-weight="700" letter-spacing="4" fill="#9a9a96">SYNTHESIS</text>
      <text x="78" y="326" font-size="30" font-weight="700" fill="#d13ab7">integration</text>
      <text x="78" y="364" font-size="18" fill="#9a9a96">movement and part of vision share the manifold</text>
      <text x="700" y="326" font-size="30" font-weight="700" fill="#23aee7">segregation</text>
      <text x="700" y="364" font-size="18" fill="#9a9a96">sparse stimulus coding reaches suppressed directions</text>
    </g>
  </g>
</svg>
